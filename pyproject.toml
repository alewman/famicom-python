[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "famicom-python"
version = "0.1.0.dev0"
description = "Readable, pure-Python Famicom and NES emulator built on 6502-python"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.23); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
# A git revision, never a local path, until 6502-python is released: main at
# 9dc34bd (RP2A03 #2, second-to-last-cycle polling #3, branch poll points #5,
# per-CPU ANE/LXA constants #6, dma_stalled and note_stall #7, CPUFrame #8).
dependencies = [
    "6502-python @ git+https://github.com/alewman/6502-python@9dc34bd74ca86773fe5c1df8d2a16b87a2ad0c29",
    # The VRC7's sound (mapper 85). Not yet on GitHub: installed from a local checkout.
    "ym2413-python @ git+https://github.com/alewman/ym2413-python@5a826ac",
]

[project.optional-dependencies]
# The desktop window (famicom_python.frontend): SDL through pygame-ce, which ships PyPy wheels.
frontend = ["pygame-ce>=2.5"]
dev = [
    "pytest>=8",
    # Pinned: `ruff format --check` in CI must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[project.scripts]
famicom-python = "famicom_python.__main__:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/famicom_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "tests/test_roms", "tests/mame_traces"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["famicom_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra -m 'not slow'"
pythonpath = ["src", "tests"]
markers = ["slow: test ROMs that run for many emulated seconds (pytest -m slow)"]
